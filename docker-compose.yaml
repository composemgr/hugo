# nginx proxy address - http://172.17.0.1:64203

name: hugo
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: hugomods/hugo:latest
    container_name: hugo-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: hugo-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      HUGO_ENV: production
    command:
      - server
      - --bind=0.0.0.0
      - --baseURL=https://${BASE_HOST_NAME:-$HOSTNAME}/
      - --appendPort=false
      - --buildDrafts=false
      - --buildFuture=false
      - --disableFastRender=true
      - --enableGitInfo=false
    ports:
      - '172.17.0.1:64203:1313'
    volumes:
      - './volumes/config/hugo:/src:z'
    networks:
      - hugo

networks:
  hugo:
    name: hugo
    external: false
